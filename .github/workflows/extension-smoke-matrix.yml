name: extension-smoke-matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_electron_smoke:
        description: 'Run optional packaged VSIX Electron smoke'
        required: false
        default: false
        type: boolean
      run_audit_gate:
        description: 'Run optional npm audit gate (high/critical)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read

jobs:
  contract-parity-gate:
    name: Contract parity gate (cross-repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extension
        uses: actions/checkout@v5

      - name: Checkout canonical Workspai CLI contracts
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/workspai
          path: workspai-cli-canonical
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Enforce cross-repo contract parity (fails build on drift)
        env:
          WORKSPAI_CLI_REPO_PATH: ${{ github.workspace }}/workspai-cli-canonical/packages/cli
        run: npm run gate:contract-parity

      - name: Install canonical Workspai CLI dependencies
        working-directory: workspai-cli-canonical
        run: corepack npm ci

      - name: Build canonical Workspai CLI executable
        working-directory: workspai-cli-canonical
        run: corepack npm run build

      - name: Runtime-verify Extension to CLI repair protocol
        env:
          WORKSPAI_CLI_PACKAGE_PATH: ${{ github.workspace }}/workspai-cli-canonical/packages/cli
        run: npx vitest run src/test/workspaceRepairCliIntegration.test.ts

      - name: Validate enterprise baseline against canonical CLI
        env:
          WORKSPAI_CLI_REPO_PATH: ${{ github.workspace }}/workspai-cli-canonical/packages/cli
        run: npm run release:enterprise-matrix -- --require-canonical

      - name: Validate Discord release announcement
        run: npm run release:discord:check

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Lint
        run: npm run lint

      - name: Lint stabilization budget
        run: npm run lint:stabilization

      - name: Format check
        if: runner.os != 'Windows'
        run: npm run format:check

      - name: Compile
        run: npm run compile

      - name: Contract drift smoke
        run: npm run test:watch -- --run src/test/driftGuard.test.ts

      - name: Backend operations import/archive smoke
        run: npm run test:watch -- --run src/test/importProjectUtils.test.ts src/test/importedProjectsRegistry.test.ts src/test/workspaceArchive.test.ts src/test/platformCapabilities.test.ts src/test/workspaceSnapshotCommands.test.ts

      - name: AI reliability release gate
        run: npm run test:ai-reliability

      - name: Shared parity contract snapshot
        run: npm run test:parity-contract

      - name: Enterprise validation matrix
        run: npm run release:enterprise-matrix

      - name: Stabilization debt budget
        run: npm run stabilization:debt-budget

      - name: Optional npm audit gate (high/critical)
        if: github.event_name == 'workflow_dispatch' && inputs.run_audit_gate == true
        run: npm run release:audit-gate

      - name: Open issue severity report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:open-issues-report -- --repo ${{ github.repository }} --output artifacts/open-issues-report.json

      - name: Release stop gate (contract/parity)
        run: npm run release:stop-gate -- --marker releases/wave3-kpi-marker.json --claim-checklist releases/wave3-claim-checklist.md --enforce-claim-checklist --issue-report artifacts/open-issues-report.json --enforce-open-issues --block-severities p0,p1 --enterprise-gate releases/wave3-enterprise-gate.json --enforce-enterprise-freeze --release-notes releases/release-posture-label.md --enforce-release-posture-label --enforce-claim-safety --release-readiness-validation-mode auto --predictive-calibration-mode production

  vsix-package-smoke:
    name: VSIX package artifact smoke
    runs-on: ubuntu-latest
    needs: [contract-parity-gate, smoke]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Build VSIX artifact
        run: npm run package:ci

      - name: Inspect VSIX artifact contents
        run: npm run smoke:vsix-artifact

      - name: Upload inspected VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspai-vsix-${{ github.sha }}
          path: rapidkit-vscode-*.vsix
          if-no-files-found: error

  vsix-electron-smoke:
    name: Optional packaged VSIX Electron smoke
    runs-on: ubuntu-latest
    needs: [vsix-package-smoke]
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.run_electron_smoke == true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Download inspected VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: workspai-vsix-${{ github.sha }}

      - name: Run packaged VSIX Electron smoke
        run: xvfb-run -a npm run smoke:vsix-electron
